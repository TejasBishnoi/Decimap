<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map API Test Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2f33;
            color: #ffffff;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: #23272a;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        h1 {
            margin-bottom: 1.5rem;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #7289da;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s ease-in-out;
        }
        button:hover {
            background-color: #5f73bc;
        }
        #response {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e2124;
            border-radius: 8px;
            border: 1px solid #42464d;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            width: 100%;
            max-width: 500px;
            text-align: left;
            min-height: 50px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Server Test Client</h1>
        <button id="sendRequestBtn">Send GET with Encrypted Query</button>
        <div id="response">Server response will appear here...</div>
    </div>

    <script>
        const sendButton = document.getElementById('sendRequestBtn');
        const responseDiv = document.getElementById('response');

        async function sendEncryptedLocationData() {
            // This is the sample location data.
            const locationData = {
                latitude: 28.7041,
                longitude: 77.1025,
                accuracy: 15,
                timestamp: new Date().toISOString()
            };

            // 1. Convert the JavaScript object to a JSON string.
            const jsonString = JSON.stringify(locationData);

            // 2. "Encrypt" the JSON string using Base64 encoding.
            // btoa() is a built-in browser function for this.
            const encryptedData = btoa(jsonString);
            
            // 3. Create the new URL with the encrypted data as a query parameter.
            const url = `http://10.6.116.54:6969/getmap?data=${encryptedData}`;

            console.log("Sending to URL:", url);
            responseDiv.textContent = 'Sending request...';

            try {
                // 4. Send the GET request. Note there is no body or headers for content-type.
                const response = await fetch(url, {
                    method: 'GET'
                });

                const responseData = await response.json();
                
                // Display the server's response in a readable format
                responseDiv.textContent = JSON.stringify(responseData, null, 2);

            } catch (error) {
                console.error('Request failed:', error);
                responseDiv.textContent = 'Error: Could not connect to the server. Is it running on port 6969?';
            }
        }

        // Attach the new function to the button's click event
        sendButton.addEventListener('click', sendEncryptedLocationData);
    </script>

</body>
</html>
