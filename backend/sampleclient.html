<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client to Test Server</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        button { font-size: 1.2rem; padding: 12px 24px; border-radius: 8px; border: none; background-color: #007bff; color: white; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        #response { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 8px; width: 80%; max-width: 600px; white-space: pre-wrap; word-wrap: break-word; font-family: "Courier New", Courier, monospace; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Client Test Page</h1>
    <button onclick="sendRequest()">Send Data to /getmap</button>
    <div id="response">Server response will appear here...</div>

    <script>
        async function sendRequest() {
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = 'Sending request...';

            try {
                // 1. Create the data object with the specified structure
                const dataToSend = {
                    latitude: 28.6272, // Sample latitude for testing (e.g., near Connaught Place)
                    longitude: 77.2158, // Sample longitude for testing
                    data: `${Math.floor(Math.random() * 30) + 10}db`, // A random data point like "25db"
                    timestamp: new Date().toISOString() // The current time in UTC format
                };

                // 2. Stringify the object to JSON
                const jsonString = JSON.stringify(dataToSend);

                // 3. "Encrypt" the JSON string using Base64 encoding
                const encryptedData = btoa(jsonString);

                // 4. Send the data as a query parameter in a GET request
                const response = await fetch(`http://10.6.116.54:6969/givedata?data=${encodeURIComponent(encryptedData)}`);
                
                const result = await response.json();
                
                responseDiv.textContent = 'Response from server:\n' + JSON.stringify(result, null, 2);

            } catch (error) {
                console.error('Error:', error);
                responseDiv.textContent = 'Failed to send request. Is the server running?';
            }
        }
    </script>
</body>
</html>
