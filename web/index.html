<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimap - Live Noise Map</title>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #0c0a09;
        }
        /* Glass effect for sidebar - Made more opaque */
        .glass-effect {
            background: rgba(12, 10, 9, 0.85); /* Increased opacity */
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(245, 158, 11, 0.2);
        }
        /* Custom scrollbar for the sidebar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.3); border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.5); }

        #map { height: 100%; width: 100%; background-color: #1c1917; }
        
        /* Custom Leaflet popups to match the theme */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1c1917;
            color: #e2e8f0;
            border-radius: 8px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .leaflet-container a.leaflet-popup-close-button { color: #a1a1aa; }
        .leaflet-control-zoom a {
            background-color: rgba(12, 10, 9, 0.7) !important;
            color: #f59e0b !important;
            border-color: rgba(245, 158, 11, 0.2) !important;
        }

        /* Loading spinner animation */
        .loader { border-top-color: #f59e0b; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Gradient text class */
        .text-gradient {
            background: linear-gradient(to right, #facc15, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* New: Styles for the heatmap legend */
        .leaflet-control-legend {
            background: rgba(12, 10, 9, 0.85);
            padding: 10px;
            border-radius: 8px;
            color: #e2e8f0;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .leaflet-control-legend .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
            color: #f59e0b;
        }
        .leaflet-control-legend .legend-scale {
            width: 150px;
            height: 15px;
            background: linear-gradient(to right, blue, cyan, lime, yellow, red);
            border-radius: 5px;
        }
        .leaflet-control-legend .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body class="bg-stone-900">

    <div id="app-container" class="relative h-screen w-screen flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="glass-effect absolute lg:relative top-0 left-0 h-full w-80 text-gray-200 p-6 shadow-2xl z-20 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out custom-scrollbar overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <a href="index.html" class="text-2xl font-bold text-amber-400">🌍 Decimap</a>
                <button id="close-sidebar-btn" class="lg:hidden text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            
            <div class="space-y-6">
                <!-- Status Section: Increased border visibility -->
                <div class="bg-stone-900/60 p-4 rounded-lg border border-amber-400/30">
                    <h2 class="text-lg font-semibold mb-2 text-amber-400">Live Status</h2>
                    <p id="data-status" class="text-sm text-center text-gray-300">Fetching live data...</p>
                    <button id="refresh-btn" class="w-full mt-3 bg-amber-500/80 hover:bg-amber-500 text-stone-900 font-bold py-2 px-4 rounded-lg transition-all duration-200 flex items-center justify-center hover:shadow-lg hover:shadow-amber-500/30">Refresh Data</button>
                </div>

                <!-- Tools Section: Enhanced button styles -->
                <div>
                    <h2 class="text-lg font-semibold mb-3 text-amber-400">Tools</h2>
                    <div class="space-y-3">
                        <button id="get-location-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 flex items-center justify-center hover:shadow-lg hover:shadow-blue-500/30">Pin My Location</button>
                        <button id="find-quietest-btn" disabled class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 flex items-center justify-center disabled:bg-gray-600 disabled:cursor-not-allowed hover:shadow-lg hover:shadow-green-500/30">Find Quietest Spot Near Me</button>
                    </div>
                </div>

                <!-- Contribution Section: Increased border visibility -->
                <div id="contribute-section" class="bg-stone-900/60 p-4 rounded-lg border border-amber-400/30 hidden">
                    <h2 class="text-lg font-semibold mb-3 text-amber-400">Contribute Data</h2>
                    <p class="text-sm text-gray-400 mb-3">Submit the noise level at your pinned location to help improve the map.</p>
                    <label for="noise-level" class="block text-sm font-medium text-gray-300">Noise Level (dB)</label>
                    <input type="range" id="noise-level" min="20" max="120" value="60" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-amber-400">
                    <div class="text-center font-bold text-amber-400 mt-2"><span id="noise-level-value">60</span> dB</div>
                    <button id="submit-data-btn" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-indigo-500/30">Submit My Reading</button>
                </div>

                <!-- Footer: Increased border visibility -->
                <div class="text-center text-xs text-gray-500 pt-4 border-t border-amber-400/30">
                    <p>Developed by Team Byte Bandits</p>
                    <a id="easter-egg-trigger" href="#" class="hover:text-amber-400">🤫</a>
                </div>
            </div>
        </aside>

        <!-- Main Content (Map) -->
        <main class="w-full h-full">
            <button id="open-sidebar-btn" class="lg:hidden absolute top-4 left-4 z-10 bg-stone-900/70 backdrop-blur-sm text-amber-400 p-2 rounded-full shadow-lg text-2xl">☰</button>
            <div id="map"></div>
        </main>
    </div>

    <!-- Custom Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-stone-800 rounded-xl shadow-2xl p-6 w-full max-w-md text-center border border-amber-400/30 transform transition-all duration-300 scale-95 opacity-0">
            <h3 id="modal-title" class="text-2xl font-bold text-amber-400 mb-4"></h3>
            <p id="modal-message" class="text-gray-300 mb-6"></p>
            <button id="modal-close-btn" class="bg-amber-500 text-stone-900 font-bold py-2 px-8 rounded-lg hover:shadow-lg hover:shadow-amber-500/30 transition-all duration-200">Close</button>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let userCoords = null;
            let quietestSpotMarker = null;
            let locationMarker = null;

            // --- MAP INITIALIZATION ---
            const indiaBounds = [[5.0, 67.0], [38.0, 98.0]];
            const map = L.map('map', { maxBounds: indiaBounds, maxBoundsViscosity: 1.0, zoomControl: false }).setView([22.5937, 78.9629], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap &copy; CartoDB', minZoom: 5 }).addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            
            const heatLayer = L.heatLayer([], { radius: 20, blur: 25, maxZoom: 12, max: 1.0, gradient: {0.4: 'blue', 0.6: 'cyan', 0.7: 'lime', 0.8: 'yellow', 1.0: 'red'} }).addTo(map);

            const dataStatus = document.getElementById('data-status');
            const findQuietestBtn = document.getElementById('find-quietest-btn');
            const contributeSection = document.getElementById('contribute-section');
            const modal = document.getElementById('modal');
            const modalContent = modal.querySelector('div');

            // --- NEW: Heatmap Legend ---
            const legend = L.control({ position: 'bottomright' });
            legend.onAdd = function (map) {
                const div = L.DomUtil.create('div', 'leaflet-control-legend');
                div.innerHTML = `
                    <div class="legend-title">Noise Level</div>
                    <div class="legend-scale"></div>
                    <div class="legend-labels">
                        <span>Quiet</span>
                        <span>Loud</span>
                    </div>
                `;
                return div;
            };
            legend.addTo(map);

            // --- API FUNCTIONS ---
            async function fetchAndDrawHeatmap() {
                setLoadingState(document.getElementById('refresh-btn'), true, 'Refreshing...');
                dataStatus.textContent = 'Fetching live data...';
                try {
                    const response = await fetch('/getmap');
                    if (!response.ok) throw new Error(`Server Error: ${response.status}`);
                    const dataPoints = await response.json();
                    
                    const heatPoints = dataPoints.map(p => [p.latitude, p.longitude, (parseFloat(p.dataPoint) || 0) / 120]);
                    heatLayer.setLatLngs(heatPoints);
                    dataStatus.textContent = `${dataPoints.length} data points loaded.`;
                } catch (error) {
                    showModal('Connection Error', "Failed to fetch heatmap data. Please ensure the backend server is running and accessible.");
                } finally {
                    setLoadingState(document.getElementById('refresh-btn'), false, 'Refresh Data');
                }
            }

            async function findQuietestSpot() {
                if (!userCoords) {
                    showModal('Location Needed', "Please pin your location first using the 'Pin My Location' button.");
                    return;
                }
                setLoadingState(findQuietestBtn, true, 'Searching...');
                if (quietestSpotMarker) map.removeLayer(quietestSpotMarker);

                try {
                    const response = await fetch(`/find-quietest-spot?lat=${userCoords.lat}&lon=${userCoords.lng}`);
                    const result = await response.json();

                    if (!response.ok) throw new Error(result.message || 'Could not find a quiet spot nearby. Try contributing more data!');

                    const { latitude, longitude, dataPoint } = result.location;
                    const greenIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
                    
                    quietestSpotMarker = L.marker([latitude, longitude], { icon: greenIcon }).addTo(map)
                        .bindPopup(`<div class="font-sans"><b>Quietest Spot Nearby</b><br>Noise Level: ${dataPoint}</div>`)
                        .openPopup();
                    map.setView([latitude, longitude], 14);

                } catch (error) {
                    showModal('Search Failed', error.message);
                } finally {
                    setLoadingState(findQuietestBtn, false, 'Find Quietest Spot Near Me');
                }
            }

            async function submitNoiseData() {
                if (!userCoords) return;
                const noiseLevel = document.getElementById('noise-level').value;
                const data = {
                    latitude: userCoords.lat,
                    longitude: userCoords.lng,
                    data: `${noiseLevel}db`,
                    timestamp: new Date().toISOString()
                };
                
                const encodedData = btoa(JSON.stringify(data));
                
                setLoadingState(document.getElementById('submit-data-btn'), true, 'Submitting...');
                try {
                    const response = await fetch(`/givedata?data=${encodeURIComponent(encodedData)}`);
                    const result = await response.json();

                    if (!response.ok) throw new Error(result.error || 'Submission failed.');
                    
                    showModal('Contribution Received!', 'Thank you! Your data has been added to the map. The heatmap will now refresh.');
                    fetchAndDrawHeatmap();

                } catch (error) {
                    showModal('Submission Error', error.message);
                } finally {
                    setLoadingState(document.getElementById('submit-data-btn'), false, 'Submit My Reading');
                }
            }
            
            // --- UI & HELPER FUNCTIONS ---
            function setLoadingState(button, isLoading, text) {
                button.disabled = isLoading;
                button.innerHTML = isLoading ? `<div class="loader h-5 w-5 border-2 rounded-full inline-block border-stone-900/50"></div> <span class="ml-2">${text}</span>` : text;
            }

            function showModal(title, message) {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').textContent = message;
                modal.classList.remove('hidden');
                setTimeout(() => { // Animate in
                    modal.classList.add('opacity-100');
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
            
            function hideModal() {
                 modalContent.classList.remove('scale-100', 'opacity-100');
                 modalContent.classList.add('scale-95', 'opacity-0');
                 modal.classList.remove('opacity-100');
                 setTimeout(() => {
                    modal.classList.add('hidden');
                 }, 300);
            }
            
            function getCurrentLocation() {
                if (!navigator.geolocation) {
                    return showModal('Unsupported Feature', 'Geolocation is not supported by your browser.');
                }
                
                const btn = document.getElementById('get-location-btn');
                setLoadingState(btn, true, 'Finding...');

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
                        map.setView([userCoords.lat, userCoords.lng], 13);
                        
                        if (locationMarker) map.removeLayer(locationMarker);
                        const orangeIcon = new L.Icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png', shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
                        
                        locationMarker = L.marker([userCoords.lat, userCoords.lng], { icon: orangeIcon }).addTo(map)
                            .bindPopup('<div class="font-sans"><b>You are here!</b><br>You can now find the quietest spot or contribute data.</div>').openPopup();
                        
                        findQuietestBtn.disabled = false;
                        contributeSection.classList.remove('hidden');
                    },
                    (error) => {
                        showModal('Geolocation Error', error.code === 1 ? "Permission denied. Please enable location services in your browser settings." : "Could not determine your location.");
                    }
                );
                setLoadingState(btn, false, 'Pin My Location');
            }
            
            // --- EVENT LISTENERS ---
            document.getElementById('refresh-btn').addEventListener('click', fetchAndDrawHeatmap);
            document.getElementById('get-location-btn').addEventListener('click', getCurrentLocation);
            findQuietestBtn.addEventListener('click', findQuietestSpot);
            document.getElementById('submit-data-btn').addEventListener('click', submitNoiseData);
            
            document.getElementById('noise-level').addEventListener('input', (e) => {
                document.getElementById('noise-level-value').textContent = e.target.value;
            });

            document.getElementById('modal-close-btn').addEventListener('click', hideModal);

            // Sidebar toggle for mobile
            const sidebar = document.getElementById('sidebar');
            document.getElementById('open-sidebar-btn').addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
            document.getElementById('close-sidebar-btn').addEventListener('click', () => sidebar.classList.add('-translate-x-full'));
            
            // Easter Egg
            document.getElementById('easter-egg-trigger').addEventListener('click', (e) => {
                e.preventDefault();
                window.open('/lol', '_blank');
            });

            // --- INITIAL LOAD ---
            fetchAndDrawHeatmap();
        });
    </script>
</body>
</html>
