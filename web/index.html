<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimap - India Map Explorer</title>
    <!-- Include Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Include Leaflet Heat plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body { margin: 0; }
        header {
            background: #1a252f;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1100;
        }
        #map {
            height: calc(100vh - 80px - 50px);
            width: calc(100% - 300px);
            margin-left: 300px;
            margin-top: 80px;
        }
        #sidebar {
            position: fixed;
            top: 80px;
            left: 0;
            width: 300px;
            height: calc(100vh - 80px - 50px);
            overflow-y: auto;
            z-index: 1000;
        }
        footer {
            background: linear-gradient(to right, #007bff, #00b7eb);
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            width: 100%;
            bottom: 0;
            height: 50px;
            z-index: 1100;
        }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <header>
        🌍 Decimap
    </header>
    <div id="sidebar">
        <h1>Decimap India Explorer</h1>
        <div>
            <p><strong>Reference:</strong> Amity University Haryana (28.3185, 76.9137)</p>
            <p>Explore India! Right-click to pin locations. Heatmap shows noise levels (50-80 dB).</p>
        </div>
        <div>
            <label for="latitude">Latitude:</label>
            <input type="number" id="latitude" step="any" placeholder="e.g., 28.3185" />
            <label for="longitude">Longitude:</label>
            <input type="number" id="longitude" step="any" placeholder="e.g., 76.9137" />
            <button onclick="updateMap()">Update Map</button>
        </div>
        <div>
            <button onclick="getCurrentLocation()">Use My Location</button>
        </div>
        <div>
            <label for="search">Search Place:</label>
            <input type="text" id="search" placeholder="e.g., Mumbai" />
            <button onclick="searchLocation()">Search</button>
        </div>
        <div>
            <h3>Add Custom Location</h3>
            <label for="customLat">Lat:</label>
            <input type="number" id="customLat" step="any" placeholder="e.g., 19.0760" />
            <label for="customLng">Lng:</label>
            <input type="number" id="customLng" step="any" placeholder="e.g., 72.8777" />
            <label for="customName">Name:</label>
            <input type="text" id="customName" placeholder="e.g., Gateway of India" />
            <label for="customNoise">Noise (dB):</label>
            <input type="number" id="customNoise" min="0" max="100" placeholder="e.g., 60" />
            <button onclick="addCustomLocation()">Add Custom POI</button>
        </div>
        <div>
            <label for="noiseFilter">Max Noise Level (dB):</label>
            <input type="range" id="noiseFilter" min="0" max="100" value="100" oninput="updateNoiseFilter()" />
            <span id="noiseValue">100</span>
        </div>
        <div>
            <label>
                <input type="checkbox" id="poiToggle" checked onchange="togglePOI()" /> Show City POIs
            </label>
        </div>
        <div>
            <label>
                <input type="checkbox" id="heatToggle" checked onchange="toggleHeat()" /> Show Noise Heatmap
            </label>
        </div>
    </div>
    <div id="map"></div>
    <footer>
        Developed by Team Byte Bandits
    </footer>

    <script>
        // Amity University Haryana coordinates (for reference)
        const AMITY_LAT = 28.3185;
        const AMITY_LNG = 76.9137;

        // Initialize the map centered on India
        let map = L.map('map').setView([21.7679, 78.9629], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Restrict map to India bounds
        const indiaBounds = L.latLngBounds(
            L.latLng(6.74678, 68.16239), // Southwest
            L.latLng(35.6745, 97.39556) // Northeast
        );
        map.setMaxBounds(indiaBounds);
        map.on('drag', function() {
            map.panInsideBounds(indiaBounds, { animate: false });
        });

        // Current marker
        let currentMarker = null;

        // POI Layer Group (with noise levels)
        let poiLayer = L.layerGroup();
        let poiMarkers = {};

        // Define POIs for major Indian cities with simulated noise levels
        let pois = [
            { lat: 28.6139, lng: 77.2090, name: 'Delhi', noise: 75 },
            { lat: 19.0760, lng: 72.8777, name: 'Mumbai', noise: 80 },
            { lat: 12.9716, lng: 77.5946, name: 'Bangalore', noise: 65 }
        ];

        // Heatmap layer
        let heatLayer = null;
        let heatPoints = [];

        // Generate simulated noise points for heatmap
        function generateNoisePoints(centerLat, centerLng, count, radius) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * radius;
                const latOffset = (distance * Math.cos(angle)) / 111;
                const lngOffset = (distance * Math.sin(angle)) / (111 * Math.cos(centerLat * Math.PI / 180));
                const lat = centerLat + latOffset;
                const lng = centerLng + lngOffset;
                const noise = 50 + Math.random() * 30;
                points.push([lat, lng, noise / 100]);
            }
            return points;
        }

        heatPoints = generateNoisePoints(21.7679, 78.9629, 100, 1000);
        heatLayer = L.heatLayer(heatPoints, {
            radius: 25,
            maxZoom: 10,
            gradient: { 0.4: 'green', 0.6: 'yellow', 0.8: 'red' } // Smooth color blending
        }).addTo(map);

        // Add POI markers
        function addPOIMarkers() {
            pois.forEach(poi => {
                const popupContent = poi.userId
                    ? `${poi.name}<br>User: ${poi.userId}<br>Date: ${poi.date}<br>Time: ${poi.time}<br>Noise: ${poi.noise} dB`
                    : `${poi.name}<br>Noise: ${poi.noise} dB`;
                const marker = L.marker([poi.lat, poi.lng]).bindPopup(popupContent);
                poiMarkers[poi.name] = marker;
                poiLayer.addLayer(marker);
            });
        }
        addPOIMarkers();
        map.addLayer(poiLayer);

        // Initial marker for Amity
        currentMarker = L.marker([AMITY_LAT, AMITY_LNG]).addTo(map)
            .bindPopup('Amity University Haryana, Gurugram')
            .openPopup();

        // Heatmap legend
        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            var grades = [50, 60, 70, 80];
            var colors = ['green', 'yellow', 'orange', 'red'];
            div.innerHTML = '<h4>Noise Levels (dB)</h4>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + colors[i] + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
            }
            return div;
        };
        legend.addTo(map);

        // Function to process JSON data (for backend integration)
        // Example: Call loadJsonDataFromBackend() when backend data is available
        function loadJsonData(jsonData) {
            try {
                const data = JSON.parse(jsonData); // Or receive as object from backend
                if (!Array.isArray(data)) {
                    console.error('JSON must be an array of location objects.');
                    return;
                }

                let invalidEntries = [];
                data.forEach((entry, index) => {
                    const lat = parseFloat(entry.latitude);
                    const lng = parseFloat(entry.longitude);
                    const noise = parseFloat(entry.noise);
                    const name = entry.userId ? `${entry.userId}'s Location` : `Location ${index + 1}`;
                    if (isNaN(lat) || lat < -90 || lat > 90 ||
                        isNaN(lng) || lng < -180 || lng > 180 ||
                        isNaN(noise) || noise < 0 || noise > 100) {
                        invalidEntries.push(index + 1);
                        return;
                    }

                    const poi = {
                        lat,
                        lng,
                        name,
                        noise,
                        userId: entry.userId || 'Unknown',
                        date: entry.date || 'N/A',
                        time: entry.time || 'N/A'
                    };
                    pois.push(poi);
                    heatPoints.push([lat, lng, noise / 100]);
                });

                if (invalidEntries.length > 0) {
                    alert(`Skipped invalid entries at indices: ${invalidEntries.join(', ')}. Ensure latitude (-90 to 90), longitude (-180 to 180), and noise (0-100) are valid.`);
                }

                // Update heatmap
                if (map.hasLayer(heatLayer)) {
                    map.removeLayer(heatLayer);
                }
                heatLayer = L.heatLayer(heatPoints, {
                    radius: 25,
                    maxZoom: 10,
                    gradient: { 0.4: 'green', 0.6: 'yellow', 0.8: 'red' }
                });
                if (document.getElementById('heatToggle').checked) {
                    map.addLayer(heatLayer);
                }

                // Update POIs
                poiLayer.clearLayers();
                poiMarkers = {};
                addPOIMarkers();
                updateNoiseFilter();
            } catch (error) {
                console.error('Error processing JSON data: ' + error.message);
            }
        }

        // Example backend call (uncomment and adapt for actual backend)
        // fetch('backend/url/for/json')
        //     .then(response => response.json())
        //     .then(data => loadJsonData(JSON.stringify(data)))
        //     .catch(error => console.error('Backend fetch error:', error));

        // Pin location on right-click
        map.on('contextmenu', function(e) {
            const pinnedMarker = L.marker(e.latlng).addTo(map)
                .bindPopup(`Pinned Location<br>Lat: ${e.latlng.lat.toFixed(4)}, Lng: ${e.latlng.lng.toFixed(4)}<br>Distance to Amity: ${calculateDistance(e.latlng.lat, e.latlng.lng, AMITY_LAT, AMITY_LNG)} km`)
                .openPopup();
        });

        // Function to add custom location
        function addCustomLocation() {
            const lat = parseFloat(document.getElementById('customLat').value);
            const lng = parseFloat(document.getElementById('customLng').value);
            const name = document.getElementById('customName').value.trim();
            const noise = parseInt(document.getElementById('customNoise').value) || 0;

            if (isNaN(lat) || isNaN(lng) || !name) {
                alert('Please enter valid latitude, longitude, and name.');
                return;
            }

            const newPoi = { lat, lng, name, noise };
            pois.push(newPoi);
            const marker = L.marker([lat, lng]).bindPopup(`${name}<br>Noise: ${noise} dB`);
            poiMarkers[name] = marker;
            heatPoints.push([lat, lng, noise / 100]);
            if (map.hasLayer(heatLayer)) {
                map.removeLayer(heatLayer);
                heatLayer = L.heatLayer(heatPoints, {
                    radius: 25,
                    maxZoom: 10,
                    gradient: { 0.4: 'green', 0.6: 'yellow', 0.8: 'red' }
                });
                if (document.getElementById('heatToggle').checked) {
                    map.addLayer(heatLayer);
                }
            }
            updateNoiseFilter();

            document.getElementById('customLat').value = '';
            document.getElementById('customLng').value = '';
            document.getElementById('customName').value = '';
            document.getElementById('customNoise').value = '';
        }

        // Haversine formula for distance
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(2);
        }

        // Update map with custom coords
        function updateMap() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lng = parseFloat(document.getElementById('longitude').value);
            if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                alert('Please enter valid coordinates (Latitude: -90 to 90, Longitude: -180 to 180)');
                return;
            }
            map.setView([lat, lng], 10);
            if (currentMarker) map.removeLayer(currentMarker);
            const distance = calculateDistance(lat, lng, AMITY_LAT, AMITY_LNG);
            currentMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`Location:<br>Lat: ${lat}, Lng: ${lng}<br>Distance to Amity: ${distance} km`)
                .openPopup();
        }

        // Geolocation
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('latitude').value = lat;
                    document.getElementById('longitude').value = lng;
                    updateMap();
                }, () => alert('Geolocation failed. Check permissions.'));
            } else {
                alert('Geolocation not supported by this browser.');
            }
        }

        // Search with Nominatim
        function searchLocation() {
            const query = document.getElementById('search').value;
            if (!query) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&countrycodes=in`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lng = parseFloat(data[0].lon);
                        document.getElementById('latitude').value = lat;
                        document.getElementById('longitude').value = lng;
                        updateMap();
                    } else {
                        alert('No results found for the search query in India.');
                    }
                })
                .catch(() => alert('Search failed. Check your connection.'));
        }

        // Update noise filter
        function updateNoiseFilter() {
            const maxNoise = parseInt(document.getElementById('noiseFilter').value);
            document.getElementById('noiseValue').textContent = maxNoise;
            poiLayer.clearLayers();
            pois.forEach(poi => {
                if (poi.noise <= maxNoise) {
                    if (!poiMarkers[poi.name]) {
                        const popupContent = poi.userId
                            ? `${poi.name}<br>User: ${poi.userId}<br>Date: ${poi.date}<br>Time: ${poi.time}<br>Noise: ${poi.noise} dB`
                            : `${poi.name}<br>Noise: ${poi.noise} dB`;
                        poiMarkers[poi.name] = L.marker([poi.lat, poi.lng]).bindPopup(popupContent);
                    }
                    poiLayer.addLayer(poiMarkers[poi.name]);
                }
            });
        }

        // Toggle POIs
        function togglePOI() {
            const checkbox = document.getElementById('poiToggle');
            if (checkbox.checked) {
                map.addLayer(poiLayer);
            } else {
                map.removeLayer(poiLayer);
            }
        }

        // Toggle Heatmap
        function toggleHeat() {
            const checkbox = document.getElementById('heatToggle');
            if (checkbox.checked) {
                map.addLayer(heatLayer);
            } else {
                map.removeLayer(heatLayer);
            }
        }
    </script>
</body>
</html>
